spring.application.name=localchat
# Server binds to ALL network interfaces, not just localhost
# This is what makes other LAN devices able to reach your app
server.port=8080
server.address=0.0.0.0
# Disable Spring Security's auto-generated user entirely
# Without this, Spring still applies some default security
# rules even when you've configured permitAll()
spring.security.user.name=disabled
spring.security.user.password=disabled

# The password required to join the room
app.chat.password=secret123

# Disable DB auto-config — we use zero persistence (in-memory only)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Show cleaner logs during development
logging.level.com.localchat=DEBUG
logging.level.org.springframework.web.socket=INFO